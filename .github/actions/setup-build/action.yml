name: Setup build environment
description: >-
  Shared CI/release/docs preamble: installs the pinned .NET SDKs, restores the
  NuGet package cache and the Aspire CLI bundle cache, and restores local
  dotnet tools (reportgenerator, docfx). Checkout is intentionally not
  included here -- each workflow checks out with its own options
  (fetch-depth, persist-credentials) before calling this action.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6

    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: nuget-

    # The AppHost projects resolve DCP and the dashboard from the Aspire CLI bundle
    # (AspireUseCliBundle) in ~/.aspire. The bundle version follows Aspire.AppHost.Sdk in
    # global.json, hence the key.
    - uses: actions/cache@v6
      id: aspire-bundle
      with:
        path: |
          ~/.aspire/versions
          ~/.aspire/bundle
        key: aspire-bundle-${{ runner.os }}-${{ hashFiles('global.json') }}

    # On a cache miss the bundle (~300 MB) is prepared here, in one process. Left to the
    # build, every AppHost of the parallel build runs the setup itself, and their concurrent
    # dnx downloads of the same CLI package collide in the NuGet cache ("being used by
    # another process"), which fails the build with ASPIRE009.
    - name: Prepare the Aspire CLI bundle
      if: steps.aspire-bundle.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        "$DOTNET_ROOT/dnx" --yes
        "aspire.cli@$(jq -r '."msbuild-sdks"."Aspire.AppHost.Sdk"' global.json)"
        -- setup --install-path "$HOME/.aspire"

    - name: Restore local dotnet tools
      shell: bash
      run: dotnet tool restore
