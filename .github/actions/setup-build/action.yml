name: Setup build environment
description: >-
  Shared CI/release/docs preamble: installs the pinned .NET SDKs, restores the
  NuGet package cache and the Aspire CLI bundle cache, and restores local
  dotnet tools (reportgenerator, docfx). Checkout is intentionally not
  included here -- each workflow checks out with its own options
  (fetch-depth, persist-credentials) before calling this action.

inputs:
  nuget-cache-fallback:
    description: >-
      Whether a NuGet cache miss restores the newest cache of another package
      set. A run that saves the cache passes 'false': the saved cache then
      holds only the packages of its own package set, instead of every package
      of every earlier set.
    default: 'true'

outputs:
  nuget-cache-hit:
    description: Whether the NuGet package cache was restored from an exact key match.
    value: ${{ steps.nuget-cache.outputs.cache-hit }}
  nuget-cache-key:
    description: The NuGet package cache key for this commit's package set, for a later actions/cache/save step.
    value: ${{ steps.nuget-cache.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # global.json pins the .NET 11 SDK, which carries only the .NET 11 runtime; the net10.0 test legs need the
    # .NET 10 runtime, which the newest .NET 10 SDK brings.
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
        dotnet-version: 10.0.x

    # Restore only: a cache saved from a pull request is scoped to that pull request's ref and evicts the
    # repository-wide caches every run restores from, so only ci.yml's main-branch runs save it, after the build.
    # The key covers every input that adds packages to ~/.nuget/packages: the projects, the central package
    # versions, and the local tools restored below.
    - uses: actions/cache/restore@v6
      id: nuget-cache
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '.config/dotnet-tools.json') }}
        restore-keys: ${{ inputs.nuget-cache-fallback == 'true' && format('nuget-{0}-', runner.os) || '' }}

    # The AppHost projects resolve DCP and the dashboard from the Aspire CLI bundle
    # (AspireUseCliBundle) in ~/.aspire. Their AspireCliInvocationMode=DnxPinned pins the CLI
    # to the Aspire.Hosting.AppHost package version, which is AspireVersion in
    # Directory.Packages.props, hence the key.
    - name: Resolve the Aspire version
      id: aspire-version
      shell: bash
      run: |
        version="$(sed -n 's:.*<AspireVersion>\(.*\)</AspireVersion>.*:\1:p' Directory.Packages.props)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: aspire-bundle
      with:
        path: |
          ~/.aspire/versions
          ~/.aspire/bundle
        key: aspire-bundle-${{ runner.os }}-${{ steps.aspire-version.outputs.version }}

    # On a cache miss the bundle (~300 MB) is prepared here, in one process. Left to the
    # build, every AppHost of the parallel build runs the setup itself, and their concurrent
    # dnx downloads of the same CLI package collide in the NuGet cache ("being used by
    # another process"), which fails the build with ASPIRE009.
    - name: Prepare the Aspire CLI bundle
      if: steps.aspire-bundle.outputs.cache-hit != 'true'
      shell: bash
      env:
        ASPIRE_VERSION: ${{ steps.aspire-version.outputs.version }}
      run: >-
        "$DOTNET_ROOT/dnx" --yes
        "aspire.cli@$ASPIRE_VERSION"
        -- setup --install-path "$HOME/.aspire"

    - name: Restore local dotnet tools
      shell: bash
      run: dotnet tool restore
