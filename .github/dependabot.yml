version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*" # Prefer a single PR per solution update.
  # Dotnet SDK
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "daily"
  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 25
    ignore:
      # Microsoft.OpenApi is versioned per-TFM in Directory.Packages.props for
      # Vulthil.SharedKernel.Api's direct use of its types (2.x on net10.0; 1.6.17 on net9.0 — ASP.NET
      # Core 9 does not consume the 2.x line and the model types' namespace differs between the lines).
      # Dependabot flattens conditional MSBuild property definitions to a single value, which would
      # force 2.x onto the net9.0 leg, so the version is hand-managed and ALL updates are ignored
      # here; NuGetAudit still fails CI on advisories. This rule lives as long as the TFM-conditional
      # MicrosoftOpenApiVersion property does.
      - dependency-name: "Microsoft.OpenApi"
      # The .NET servicing train (ASP.NET Core + EF Core) versions from the TFM-conditional
      # FrameworkVersion property in Directory.Packages.props (10.0.x on net10.0, 9.0.x on net9.0).
      # Dependabot cannot evaluate the conditions: it rewrites only the last FrameworkVersion
      # definition it resolves, tearing the legs apart (PR #378 moved the net9.0 leg to 9.0.19 and
      # left net10.0 at 10.0.10) — or, as with Microsoft.OpenApi above, forcing one TFM's major onto
      # the other. The train is hand-managed as a single lockstep bump of both legs (see #355);
      # NuGetAudit still fails CI on advisories. The EF ignore also protects the consumer floor:
      # EfCoreMinimumVersion in Directory.Packages.props derives from the train's net9.0 leg
      # ($(Net9FrameworkVersion)), so the lockstep bump moves the floor automatically and only a
      # deliberate edit can move it across an EF major.
      - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
      - dependency-name: "Microsoft.AspNetCore.OpenApi"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      # The Microting Pomelo fork floors Microsoft.EntityFrameworkCore.Relational at its own patch
      # level, so bumping it ahead of the hand-managed train is an NU1605 downgrade error; it moves
      # with the train.
      - dependency-name: "Microting.EntityFrameworkCore.MySql"
    groups:
      xunit:
        patterns:
          - "xunit"
          - "xunit.*"
      dotnet:
        patterns:
          - "*"