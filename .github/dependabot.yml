version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*" # Prefer a single PR per solution update.
  # Dotnet SDK
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "daily"
  # NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 25
    ignore:
      # The .NET servicing train (ASP.NET Core, EF Core, and the in-box Microsoft.Extensions.* packages) versions
      # from properties in Directory.Packages.props. FrameworkVersion is TFM-conditional (10.0.x on net10.0, 11.0.x on
      # net11.0); Dependabot cannot evaluate the conditions, so it rewrites only one definition and tears the legs
      # apart or forces one TFM's major onto the other. EfCoreVersion and the consumer EF floor
      # (EfCoreMinimumVersion) derive from the net10.0 leg, so only a deliberate edit moves EF Core across a major.
      # The train is hand-managed as a single lockstep bump of every leg; NuGetAudit still fails CI on advisories.
      - dependency-name: "Microsoft.AspNetCore.Mvc.Testing"
      - dependency-name: "Microsoft.AspNetCore.OpenApi"
      - dependency-name: "Microsoft.AspNetCore.TestHost"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Microsoft.Extensions.Configuration.Abstractions"
      - dependency-name: "Microsoft.Extensions.DependencyInjection.Abstractions"
      - dependency-name: "Microsoft.Extensions.Diagnostics.HealthChecks"
      - dependency-name: "Microsoft.Extensions.Hosting.Abstractions"
      - dependency-name: "Microsoft.Extensions.Http"
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
      - dependency-name: "Microsoft.Extensions.Options.ConfigurationExtensions"
      - dependency-name: "Microsoft.Extensions.Options.DataAnnotations"
      # Microting.EntityFrameworkCore.MySql floors Microsoft.EntityFrameworkCore.Relational at its own patch level,
      # and each major requires the matching EF Core major, so it moves with the train.
      - dependency-name: "Microting.EntityFrameworkCore.MySql"
      # EFCore.NamingConventions (test-only): each major requires the matching EF Core major, so it moves with the
      # train.
      - dependency-name: "EFCore.NamingConventions"
      # From Aspire 17.0.0, the EF Core client integrations take EF Core 11 on net11.0 (Cosmos) or exist only as a
      # preview (Npgsql), so they move to a new major with EF Core, by hand (AspireEfCoreVersion).
      - dependency-name: "Aspire.Microsoft.EntityFrameworkCore.Cosmos"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Aspire.Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
    groups:
      xunit:
        patterns:
          - "xunit"
          - "xunit.*"
      dotnet:
        patterns:
          - "*"